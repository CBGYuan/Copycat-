MCC_Conflict_Reconnection_Failure_Analysis:
  name: "MCC-Conflict Reconnection Failure Analysis"
  description: "Diagnoses MCC-conflict-induced missed-beacon events and the resulting failed roam/reconnect attempts — covering the arc from crossing through AUTH failures, EAPOL stalls, exclude-list buildup, and AP re-selection retries — distinct from the Disconnection skill (which covers the teardown cause) and the AP Selection skill (which covers grade-delta scoring only)."
  keywords:
    - "MISSED BEACONS"
    - "CNCT_FLOW"
    - "TASK_Connect"
    - "[ATTEMPT_TO_CONNECT]"
    - "DeAuth"
    - "WDI_ASSOC_STATUS_SUCCESS"
    - "CONNECTED - to: "
    - "TASK_DISCONNECT[8]"
    - "Got Command"
    - "Mcc"
    - "TASK ROAM"
    - "NIC State"
  exclusive:
    - "SCAN_REQUEST"
    - "SCAN_RESULTS"
    - "printScanRequestInfo"
    - "TASK_CONNECT_PARAMS"
    - "TASK_SCAN"
    - "PROP_GET_STATISTICS"
    - "PROP_SET_"
    - "[hPolicyBeaconProbeReceivedEvent]:GOT BEACON/PROB"
    - "stateMachineSetStateNoCurrentFlow"
    - "[prvBssVifClcConnectedEntryHandler]:Setting timer to trigger Sync VIF manager on Bss connection"
  expert_rules: |
    1. Missed-beacon threshold check.
    - If the log contains a line matching 'MISSED BEACONS' with a consecutive count exceeding the initial threshold:
      For example: 04/14/2026-01:20:26.340 [3] [ROAM_DECISION] [SPECIAL] [roamingDecisionHandleEventMissedBeacons]:MISSED BEACONS on VIF ID 0, driver link index 0 - Consecutive missed beacons  (11) crossed the initial threshold of 9 for the first time
      Then conclude:
        - Missed-beacon trigger = Yes
        - Threshold crossed = initial (9 beacons)
        - This is the root event that spawns the emergency scan and reconnect loop.
      Include the matching log line as evidence.

    2. MCC conflict as causal factor (engineer-provided rule — not directly demonstrated in this session's log excerpt).
    - If 'Mcc' lines appear near or before the missed-beacon event or AUTH_TX_FAILURE lines:
      Then conclude:
        - MCC conflict is a candidate root cause for the beacon gap or channel-level auth failure.
        - MCC conflict can manifest as: (a) driver refusing to tx auth frames on channels blocked by MCC regulatory constraint, or (b) MCC-forced channel switch causing the beacon gap.
      Record the Mcc log lines and their timestamps relative to the MISSED BEACONS event.
    - If 'Mcc' lines are absent or appear only after successful reconnect:
      Then conclude:
        - MCC conflict is not confirmed as causal; treat MISSED BEACONS as RF/signal issue.

    3. Emergency scan and candidate search.
    - If the log contains '[prvRoamingDecisionOnMissedBeaconsThresholdCrossed]' with 'triggering emergency scan':
      For example: 04/14/2026-01:20:26.343 [3] [ROAM_DECISION] [SPECIAL] [prvRoamingDecisionOnMissedBeaconsThresholdCrossed]:MISSED BEACONS on VIF ID 0 - triggering emergency scan since other candidate found
      Then conclude:
        - Emergency scan triggered = Yes
        - At least one roam candidate was known at trigger time.
    - If 'Preliminary timeout occurred, we haven't discovered any candidate yet' appears:
      For example: 04/14/2026-01:20:26.350 [3] [CNCT_FLOW] [SPECIAL] [findCandidateUrgentScanPreliminaryTimeoutHandler]:FIND_CANDIDATE (VIF ID 0): Preliminary timeout occurred, we haven't discovered any candidate yet, Urgent scan continues..
      Then conclude:
        - No candidate found within preliminary timeout; urgent scan extended.
        - This delays reconnect and is a contributing factor to total recovery time.

    4. AUTH failure and exclude-list buildup.
    - If the log contains 'CONNECTION FAILED - AUTH_TX_FAILURE' in a CNCT_FLOW line:
      For example: 04/14/2026-01:21:21.127 [3] [CNCT_FLOW] [ERROR] [cnctPluginBssFailureApPropertiesMismatch]:CONNECTION FAILED - AUTH_TX_FAILURE(9)
      Then conclude:
        - Auth failure type = AUTH_TX_FAILURE (no ACK from AP).
        - Check whether the channel of the failed BSSID is one that MCC conflict would block.
    - If 'EXCLUDE_LIST_NON_PERMANENT - CNCT FAIL COUNT INCREASED' appears:
      For example: 04/14/2026-01:21:21.131 [3] [CNCT_FLOW] [SPECIAL] [excludeListAddExcludeReasons]:EXCLUDE_LIST_NON_PERMANENT - CNCT FAIL COUNT INCREASED - BSSID Might be excluded if thresholds will exceeds(4,2), failure = 2, 1x failure = 0 - Address(74:9E:75:48:CA:E1)
      Then conclude:
        - BSSID is accumulating non-permanent exclude strikes.
        - Record BSSID, failure count, and threshold (format: current_failures, 1x_failures).
        - If failure count reaches the threshold, the BSSID will be excluded and the driver must select a new candidate.

    5. [ATTEMPT_TO_CONNECT] candidate tracking.
    - For each '[ATTEMPT_TO_CONNECT]' line, extract: SSID, channel, RSSI, BSSID.
      For example: 04/14/2026-01:21:21.136 [3] [HMAC_CM] [PRIVATE] [bssVifLinkProcessAttemptToConnectRequestApi]:[ATTEMPT_TO_CONNECT] Ssid:tesla-secure Ch:53 Rssi:-79 Bssid: Address(74:9E:75:48:CA:E1)
      Then conclude:
        - Build a chronological table of attempted BSSIDs, channels, and RSSI values.
        - If the same BSSID is retried after an AUTH_TX_FAILURE, check whether its exclude count has not yet hit the threshold.
        - Channel changes between attempts (e.g. Ch:53 → Ch:157) may indicate MCC-driven candidate switching.

    6. EAPOL exchange health.
    - If EAPOL TRANSMIT and EAPOL RECEIVED lines alternate normally within ~1 second:
      Then conclude: 4-way handshake progressing normally.
    - If EAPOL TRANSMIT appears without a following EAPOL RECEIVED within several seconds, or if the sequence repeats more than 4 times without WDI_ASSOC_STATUS_SUCCESS:
      Then conclude: EAPOL stall — possible AP-side rejection or key mismatch; note the timestamp gap.

    7. Successful reconnect confirmation.
    - If 'WDI_ASSOC_STATUS_SUCCESS' and 'CONNECTED - to: ' both appear in CNCT_FLOW lines:
      For example: 04/14/2026-01:20:34.874 context — look for the line matching 'CONNECTED - to: ' with a BSSID and timestamp.
      Then conclude:
        - Reconnect succeeded.
        - Record: final BSSID, channel, SSID, and total elapsed time from first MISSED BEACONS line to CONNECTED timestamp.
        - If elapsed time > 30 seconds, flag as extended recovery.

    8. NIC State transitions.
    - If 'NIC State' lines appear, record each state and timestamp.
      Then conclude:
        - NIC state changes during the reconnect loop indicate driver-level resets (e.g. TASK_DOT11_RESET) that restart the connection state machine.
        - A TASK_DOT11_RESET (visible at 04/14/2026-01:22:01.691) following repeated AUTH failures signals the driver gave up on the current candidate set and reset.

    9. Mcc periodic housekeeping vs. causal lines.
    - 'Mcc' lines that appear at regular intervals unrelated to the MISSED BEACONS or AUTH failure timestamps are periodic regulatory housekeeping and are not causal evidence.
    - Only flag Mcc lines that occur within ±5 seconds of a MISSED BEACONS event or AUTH_TX_FAILURE as potentially causal (engineer-provided threshold — not directly demonstrated in this session's log).

    10. Summary fields to report.
    - Missed-beacon trigger: Yes/No, count vs. threshold.
    - MCC conflict causal: Yes/No/Unconfirmed, supporting Mcc log lines.
    - Auth failure type and affected BSSIDs/channels.
    - Exclude-list state per BSSID at time of failure.
    - Total reconnect attempts (count of [ATTEMPT_TO_CONNECT] lines).
    - EAPOL stall: Yes/No.
    - Final reconnect: Yes/No, BSSID, channel, elapsed recovery time.
  tat_path: "C:/Users/yuanyuan/Downloads/connectivity (1).tat"

