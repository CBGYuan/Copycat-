AP_Selection_Roam_Candidate_Scoring:
  name: "AP Selection / Roam Candidate Scoring"
  description: "Analyzes the Wi-Fi driver's AP-selection grade formula (tput, chLoad, RSSI zone), roam-trigger conditions (ROAM_REASON_AP_DEGRADATION), and roam-execute-vs-suppress decisions based on the +20% grade-delta hysteresis rule — covering only the scoring and candidate-comparison phase, not connection setup, disconnection teardown, or MCC/regulatory housekeeping."
  keywords:
    - "ApSelectionApply"
    - "Best Candidate"
    - "ROAM_REASON_AP_DEGRADATION"
    - "CNCT_FLOW"
    - "BG_SCAN - RSSI CHANGE"
  exclusive:
    - "SCAN_REQUEST"
    - "SCAN_RESULTS"
    - "WDI_GET_BSS_ENTRY_LIST_UPDATE"
    - "printScanRequestInfo"
    - "PROP_GET_STATISTICS"
    - "TASK_SCAN"
    - "PROP_IHV_REQUEST"
    - "oscSetMccTestModeRequestDone"
    - "OID_WIFI_MCC"
  expert_rules: |
    1. GRADE FORMULA: Grade ≈ tput × (1 - chLoad%) + RSSI_Bonus. RSSI_Bonus = 0 when RSSI is between -50 and -70 dBm (neutral zone); positive bonus above -50 dBm; negative penalty below -70 dBm (magnitudes not yet quantified). Validation: at chLoad=0%, grade equals tput exactly (e.g., tput=2,074,800 → grade=2,074,800).

    2. CHANNEL LOAD IMPACT: chLoad is the dominant grade driver when RSSI is stable. At chLoad=80%, grade collapses ~80% from baseline (e.g., 2,074,800 → 414,960). Threshold for concern: chLoad ≥ 70–80%.

    3. ROAM TRIGGER — AP DEGRADATION: When the current AP grade drops significantly below the driver health baseline (typically chLoad ≥ 70–80%), the driver fires ROAM_REASON_AP_DEGRADATION. Log pattern: '[CNCT_FLOW] roamingDecisionFindCandidateDueToLowRssi: (VIF ID 0): Searching for a candidate due to ROAM_REASON_AP_DEGRADATION'.

    4. ROAM EXECUTION THRESHOLD (+20% HYSTERESIS): A roam to a new AP executes only if candidate AP grade > current AP grade × 1.2. If no candidate clears this bar, the driver re-selects the current AP (roam-abort / stay). Log pattern: Best Candidate MAC remains the same AP after ROAM_REASON_AP_DEGRADATION fires.

    5. SINGLE-CANDIDATE DIAGNOSIS: If every scoring cycle shows only '[Best Candidate 0]' with no '[Best Candidate 1]', either no other AP is in range or alternatives were pre-filtered before grading. Cross-check excluded scan results (SCAN_RESULTS keyword) to distinguish these cases.

    6. GRADE BONUS APPLICATION: 'prvApSelectionApplyGradeBonuses' fires before 'prvApSelectionChooseBestCandidate' every cycle. Bonuses may apply for 11v-preferred, BTcoex=FALSE, or same-band stickiness. When mode=<NULL>, no active bonus mode is applied (treat as normal, not anomalous, unless grade is unexpectedly low).

    7. BG_SCAN RSSI CHANGE AS UPSTREAM TRIGGER: 'BG_SCAN - RSSI CHANGE - rescheduling' events (bgScanClientRssiChangedAPI) may precede ApSelectionApply cycles. Confirm co-occurrence timing to determine if RSSI change is the direct upstream trigger for a grade re-evaluation.

    8. MCC POLLING IS NOISE: Periodic OID_WIFI_MCC_API_TEST_MODE / oscSetMccTestModeRequestDone entries (currMCC=0x5553, ucodeStatus=6, elapsedTime in TU=30sec units) are routine LAR housekeeping unrelated to AP-selection scoring. Exclude via 'OID_WIFI_MCC' and 'oscSetMccTestModeRequestDone'. MCC regulatory analysis belongs to the 'regulatory_country_code_determination' skill.

    9. REFERENCE CASE (2025-10-28): AP 7C:10:C9:69:EF:A8, band=2, ch=37, BW=160MHz, RSSI=-55 to -57 dBm (stable, neutral zone), tput=2,074,800 (stable). Grade ranged 345,840–2,074,800 driven solely by chLoad (0–80%). ROAM_REASON_AP_DEGRADATION fired at 10:57:23 (chLoad=80%, grade=414,960). Roam suppressed — no alternative candidate found; driver re-selected current AP.
  tat_path: "C:/Users/yuanyuan/Downloads/connectivity.tat"

